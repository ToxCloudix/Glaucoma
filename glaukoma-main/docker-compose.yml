name: glaucoma-app

services:
  postgres:
    image: postgres:16
    ports:
      - 5437:5432
    env_file:
      - .env.app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  app:
    build: .
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - 8000:8000
    env_file:
      - .env.app
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
